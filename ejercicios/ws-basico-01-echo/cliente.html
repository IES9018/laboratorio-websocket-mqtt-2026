<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WS Basico 01 - Echo</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 900px; margin: 0 auto; }
    #auth-panel { background: #f0f0f0; padding: 15px; border-radius: 5px; margin-bottom: 15px; }
    #chat-panel { display: none; }
    input, button, select, textarea { padding: 8px; margin: 5px 0; }
    #msg { width: 70%; }
    #log { background: #1e1e1e; color: #0f0; padding: 10px; height: 300px; overflow-y: auto; white-space: pre-wrap; font-family: monospace; }
    .error { color: #ff6b6b; }
    .success { color: #51cf66; }
    .info { color: #74c0fc; }
    .json { color: #ffd43b; }
    .panel { background: #f8f9fa; padding: 15px; border-radius: 5px; margin-bottom: 10px; }
    label { display: inline-block; width: 100px; }
  </style>
</head>
<body>
  <h1>WS Basico 01 - Echo</h1>
  
  <div id="auth-panel">
    <h3>Autenticación</h3>
    <input id="username" placeholder="Usuario" value="admin" />
    <input id="password" type="password" placeholder="Contraseña" value="admin123" />
    <button id="connect">Conectar</button>
    <p><small>Credenciales: admin/admin123, user/user123, invitado/invitado123</small></p>
  </div>
  
  <div id="chat-panel">
    <p>Conectado a ws://localhost:8765</p>
    
    <div class="panel">
      <h4>Enviar mensaje</h4>
      <select id="formato">
        <option value="texto">Texto plano</option>
        <option value="json">JSON estructurado</option>
      </select>
      <br>
      <div id="panel-texto">
        <input id="msg" placeholder="mensaje" style="width: 70%;" />
      </div>
      <div id="panel-json" style="display: none;">
        <input id="json-usuario" placeholder="usuario" value="admin" />
        <input id="json-mensaje" placeholder="mensaje" value="Hola mundo" />
      </div>
      <button id="send">Enviar</button>
    </div>
    
    <pre id="log"></pre>
  </div>

  <script>
    const log = document.getElementById('log');
    const input = document.getElementById('msg');
    const btn = document.getElementById('send');
    const authPanel = document.getElementById('auth-panel');
    const chatPanel = document.getElementById('chat-panel');
    const connectBtn = document.getElementById('connect');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const formatoSelect = document.getElementById('formato');
    const panelTexto = document.getElementById('panel-texto');
    const panelJson = document.getElementById('panel-json');
    const jsonUsuario = document.getElementById('json-usuario');
    const jsonMensaje = document.getElementById('json-mensaje');
    
    let ws = null;
    let autenticado = false;
    let usuarioActual = '';

    const add = (t, className = '') => { 
      log.innerHTML += (className ? `<span class="${className}">${t}</span>` : t) + '\n'; 
      log.scrollTop = log.scrollHeight;
    };

    // Cambiar entre formato texto y JSON
    formatoSelect.onchange = () => {
      if (formatoSelect.value === 'json') {
        panelTexto.style.display = 'none';
        panelJson.style.display = 'block';
        jsonUsuario.value = usernameInput.value || 'admin';
      } else {
        panelTexto.style.display = 'block';
        panelJson.style.display = 'none';
      }
    };

    connectBtn.onclick = () => {
      if (ws) ws.close();
      
      ws = new WebSocket('ws://localhost:8765');
      usuarioActual = usernameInput.value;
      
      ws.onopen = () => {
        add('Conectando...', 'success');
      };
      
      ws.onmessage = (e) => {
        try {
          const data = JSON.parse(e.data);
          
          if (data.tipo === 'auth_required') {
            const authMsg = JSON.stringify({
              username: usernameInput.value,
              password: passwordInput.value
            });
            ws.send(authMsg);
            add('Enviando credenciales...');
          } else if (data.tipo === 'auth_success') {
            autenticado = true;
            authPanel.style.display = 'none';
            chatPanel.style.display = 'block';
            add(`Servidor: ${data.mensaje}`, 'success');
            jsonUsuario.value = data.username || usernameInput.value;
          } else if (data.tipo === 'auth_error') {
            add(`Error: ${data.mensaje}`, 'error');
          } else if (data.tipo === 'error') {
            add(`Error ${data.codigo}: ${data.descripcion}`, 'error');
            if (data.detalles) {
              data.detalles.forEach(d => add(`  - ${d}`, 'error'));
            }
          } else if (data.tipo === 'ok') {
            add(`Servidor: ${data.mensaje}`, 'success');
          } else {
            add('Servidor: ' + JSON.stringify(data, null, 2), 'json');
          }
        } catch {
          add('Servidor: ' + e.data);
        }
      };
      
      ws.onclose = (e) => {
        add(`Conexión cerrada: ${e.reason || 'Sin motivo'}`, 'error');
        autenticado = false;
        authPanel.style.display = 'block';
        chatPanel.style.display = 'none';
      };
      
      ws.onerror = (e) => {
        add('Error de conexión', 'error');
      };
    };

    btn.onclick = () => {
      if (ws && autenticado && ws.readyState === WebSocket.OPEN) {
        let mensaje;
        
        if (formatoSelect.value === 'json') {
          mensaje = JSON.stringify({
            usuario: jsonUsuario.value,
            mensaje: jsonMensaje.value
          });
          add('Cliente (JSON): ' + mensaje, 'json');
        } else {
          mensaje = input.value;
          add('Cliente: ' + mensaje);
        }
        
        ws.send(mensaje);
        
        if (formatoSelect.value === 'texto') {
          input.value = '';
        } else {
          jsonMensaje.value = '';
        }
      } else {
        add('No conectado o no autenticado', 'error');
      }
    };
  </script>
</body>
</html>
