<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WS Basico 03 - Validacion</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
    #auth-panel { background: #f0f0f0; padding: 15px; border-radius: 5px; margin-bottom: 15px; }
    #chat-panel { display: none; }
    textarea, input, button { padding: 8px; margin: 5px 0; }
    #msg { width: 70%; }
    #log { background: #1e1e1e; color: #0f0; padding: 10px; height: 300px; overflow-y: auto; white-space: pre-wrap; }
    .error { color: red; }
    .success { color: green; }
  </style>
</head>
<body>
  <h1>WS Basico 03 - Validacion de JSON</h1>
  <p>Conectar a ws://localhost:8803</p>
  
  <div id="auth-panel">
    <h3>Autenticación</h3>
    <input id="username" placeholder="Usuario" value="admin" />
    <input id="password" type="password" placeholder="Contraseña" value="admin123" />
    <button id="connect">Conectar</button>
    <p><small>Credenciales: admin/admin123, user/user123, invitado/invitado123</small></p>
  </div>
  
  <div id="chat-panel">
    <textarea id="msg" rows="5" cols="60">{"usuario":"equipo1","mensaje":"hola"}</textarea>
    <br />
    <button id="send">Enviar JSON</button>
    <pre id="log"></pre>
  </div>

  <script>
    const log = document.getElementById('log');
    const input = document.getElementById('msg');
    const btn = document.getElementById('send');
    const authPanel = document.getElementById('auth-panel');
    const chatPanel = document.getElementById('chat-panel');
    const connectBtn = document.getElementById('connect');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    
    let ws = null;
    let autenticado = false;

    const add = (t, className = '') => { 
      log.textContent += (className ? `<span class="${className}">${t}</span>` : t) + '\n'; 
      log.scrollTop = log.scrollHeight;
    };

    connectBtn.onclick = () => {
      if (ws) ws.close();
      
      ws = new WebSocket('ws://localhost:8803');
      
      ws.onopen = () => add('Conectando...', 'success');
      
      ws.onmessage = (e) => {
        try {
          const data = JSON.parse(e.data);
          
          if (data.tipo === 'auth_required') {
            const authMsg = JSON.stringify({
              username: usernameInput.value,
              password: passwordInput.value
            });
            ws.send(authMsg);
            add('Enviando credenciales...');
          } else if (data.tipo === 'auth_success') {
            autenticado = true;
            authPanel.style.display = 'none';
            chatPanel.style.display = 'block';
            add(`Servidor: ${data.mensaje}`, 'success');
          } else if (data.tipo === 'auth_error') {
            add(`Error: ${data.mensaje}`, 'error');
          } else {
            add('Servidor: ' + e.data);
          }
        } catch {
          add('Servidor: ' + e.data);
        }
      };
      
      ws.onclose = (e) => {
        add(`Conexión cerrada: ${e.reason || 'Sin motivo'}`, 'error');
        autenticado = false;
        authPanel.style.display = 'block';
        chatPanel.style.display = 'none';
      };
      
      ws.onerror = (e) => add('Error de conexión', 'error');
    };

    btn.onclick = () => {
      if (ws && autenticado && ws.readyState === WebSocket.OPEN) {
        ws.send(input.value);
        add('Cliente: ' + input.value);
      } else {
        add('No conectado o no autenticado', 'error');
      }
    };
  </script>
</body>
</html>
